[project]
name = "anda"
version = "0.1.0"
description = "고령층 보호를 위한 AI 기반 피싱 탐지 서비스"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    # Deep Learning
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.35.0",
    # Browser Automation
    "playwright>=1.40.0",
    # Vector Search
    "faiss-cpu>=1.7.4",
    # Additional dependencies
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "aiohttp>=3.9.0",
    "pillow>=10.1.0",
    "streamlit>=1.53.1",
    "plotly>=6.5.2",
    "pandas>=2.3.3",
    # Link Interpreter AI
    "tldextract>=5.1.0",
    "beautifulsoup4>=4.12.0",
    # Visual Similarity Analysis
    "scikit-image>=0.22.0",
    "imagehash>=4.3.0",
]

[project.scripts]
anda = "main:app"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]
